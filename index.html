<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>三国守城</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#24180e;color:#3a2414;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;overflow:hidden;overscroll-behavior:none}
.kai{font-family:"KaiTi","STKaiti","Kaiti SC","楷体",serif}
#app{display:flex;flex-direction:column;height:100%;max-width:860px;margin:0 auto}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#top{display:flex;justify-content:space-around;align-items:center;padding:4px 4px;background:#efe0bd;border-bottom:3px double #7a4a24;font-size:15px;gap:2px 8px;flex-wrap:wrap;line-height:1.3}
#top b{color:#a8261c}
#top .nx{font-size:13px;color:#7a2a14;background:#f8e6bc;border-radius:4px;padding:0 5px}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:3px;position:relative;background:#3a2a1a}
canvas#cv{display:block;touch-action:none;border:3px solid #7a4a24;border-radius:4px}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#2a1a0ee6;color:#ffd56b;padding:7px 16px;border-radius:18px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;border:1px solid #a07a44;z-index:3}
#tip{position:absolute;left:8px;right:8px;bottom:8px;background:#fff6dcf2;border:3px solid #a8261c;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.5;z-index:4;display:flex;gap:8px;align-items:center}
#tip button{flex:none;font-size:14px;padding:5px 10px}
#side{background:#efe0bd;border-top:3px double #7a4a24;display:flex;flex-direction:column;position:relative}
#bar{display:flex;gap:4px;padding:4px;justify-content:center;flex-wrap:wrap}
button{font-family:inherit;font-size:15px;border:2px solid #4a2a10;border-radius:6px;padding:6px 9px;cursor:pointer;background:#7a4a24;color:#fbecc8;font-weight:bold}
button.red{background:#a8261c;border-color:#5e120c}
button.off{opacity:.45}
#bShop{display:none}
#info{min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:13px;line-height:1.4;padding:2px 6px;color:#4a2e18}
#info .tx{text-align:left;flex:1;min-width:0}
#bond{font-size:12px;color:#6a4a2a;text-align:center;padding:0 4px 3px;line-height:1.6}
#bond span{display:inline-block;margin:1px 2px;padding:0 4px;border-radius:4px;background:#e2d0a8}
#bond span.on{background:#a8261c;color:#fff}
.row{display:flex;gap:4px;padding:3px 5px;align-items:stretch}
.slot{flex:1;height:66px;border:3px solid #b89a6a;border-radius:7px;background:#e6d4ae;position:relative;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;touch-action:none;overflow:hidden}
.slot.empty{border-style:dashed;cursor:default}
.slot.sel{outline:3px solid #a8261c}
.slot.t1{border-color:#9a9a9a}.slot.t2{border-color:#3f9a4a}.slot.t3{border-color:#3b6fc9}.slot.t4{border-color:#8b45c4}.slot.t5{border-color:#e0a42a}
.slot canvas{height:40px;image-rendering:pixelated}
.slot .nm{font-size:11px;font-weight:bold;line-height:1.2;white-space:nowrap;color:#3a2414}
.slot .st{position:absolute;top:0;right:2px;font-size:9px;color:#d68a00;letter-spacing:-1px}
.slot .ri{position:absolute;top:1px;left:1px;width:12px;image-rendering:pixelated}
.slot .eq{position:absolute;bottom:13px;right:1px;font-size:10px;line-height:1}
.tabs{display:flex;gap:4px;padding:2px 5px 0}
.tab{flex:1;text-align:center;padding:5px 0;font-size:14px;font-weight:bold;border-radius:6px 6px 0 0;background:#d9c49a;color:#6a4a2a;cursor:pointer}
.tab.on{background:#7a4a24;color:#fbecc8}
#shop{display:grid;grid-template-columns:repeat(5,1fr) 0.8fr;gap:4px;padding:4px 5px 6px;min-height:100px}
#shop.items{grid-template-columns:repeat(4,1fr) 0.8fr}
#shop.bag{grid-template-columns:repeat(4,1fr)}
.card{background:#f8edd2;border:3px solid #999;border-radius:7px;padding:2px 1px 3px;text-align:center;cursor:grab;position:relative;min-width:0;overflow:hidden;touch-action:none}
.card.t1{border-color:#9a9a9a}.card.t2{border-color:#3f9a4a}.card.t3{border-color:#3b6fc9}.card.t4{border-color:#8b45c4}.card.t5{border-color:#e0a42a;background:#fff3cf}
.card.ex{border-color:#d0451b;background:#ffe9cf;animation:gl2 1.2s infinite alternate}
.card.mg{animation:mg .7s infinite alternate;border-color:#ffb000!important}
@keyframes mg{from{box-shadow:0 0 0 2px #ffd56b,0 0 4px #ffb000}to{box-shadow:0 0 0 4px #ffd56b,0 0 14px #ff8a00}}
@keyframes gl2{from{box-shadow:0 0 2px #d0451b}to{box-shadow:0 0 10px #ff7a3a}}
.card.no{opacity:.5}.card.sel{outline:3px solid #a8261c}
.card.empty{opacity:.35;border-style:dashed;cursor:default}
.card canvas{image-rendering:pixelated;height:42px;display:block;margin:0 auto}
.card .nm{font-size:13px;font-weight:bold;white-space:nowrap;color:#3a2414}
.card .sub{font-size:10px;color:#7a5a3a;white-space:nowrap;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:2px}
.card .sub img{width:11px;image-rendering:pixelated}
.card .ct{font-size:13px;color:#a8261c;font-weight:bold}
.card .hs{position:absolute;top:1px;left:2px;font-size:10px;color:#d68a00}
.card .ic{font-size:24px;line-height:40px;height:40px}
.card .mgt{position:absolute;top:0;right:0;background:#ffb000;color:#3a1a00;font-size:10px;font-weight:bold;padding:0 3px;border-radius:0 0 0 5px}
#roll{border-radius:7px;font-size:13px;padding:2px;line-height:1.35}
#sellzone{position:absolute;left:4px;right:4px;top:2px;height:84px;border:4px dashed #ffd56b;border-radius:12px;background:#a8261ce0;color:#fff;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:20;text-align:center;line-height:1.4}
#sellzone.hot{background:#e0301ef0;transform:scale(1.02)}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;width:72px;height:90px;transform-origin:50% 100%}
#ghost canvas{width:72px;height:90px;image-rendering:pixelated;filter:drop-shadow(0 6px 6px #0008)}
#ghost .ic{font-size:44px;text-align:center;line-height:90px;filter:drop-shadow(0 6px 6px #0008)}
#ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:70;padding:12px;overflow:auto}
#ov .box{background:#efe0bd;border:4px double #7a4a24;border-radius:10px;padding:16px;max-width:520px;width:100%;text-align:center;line-height:1.6;font-size:15px;max-height:100%;overflow:auto}
#ov h1{margin:0 0 6px;font-size:32px;color:#a8261c;letter-spacing:6px}
#ov h2{margin:4px 0;font-size:20px;color:#7a2a14}
#ov .opts{display:grid;gap:8px;margin:10px 0}
#ov .opt{border:3px solid #7a4a24;border-radius:8px;padding:8px;background:#f8edd2;cursor:pointer;text-align:left}
#ov .opt.lock{opacity:.45;cursor:default}
#ov .opt.on{background:#ffe2a8;border-color:#a8261c}
#ov .opt b{font-size:18px}
#ov .opt small{color:#6a4a2a;display:block;line-height:1.5}
#ov button{font-size:18px;padding:9px 26px;margin:4px}
#ov table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
#ov td{border-bottom:1px solid #d2bb8c;padding:3px 2px;vertical-align:middle}
#ov td:first-child{white-space:nowrap;padding-right:6px}
#ov .btabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0}
#ov .btabs span{padding:4px 9px;border-radius:6px;background:#d9c49a;cursor:pointer;font-size:14px;font-weight:bold}
#ov .btabs span.on{background:#7a4a24;color:#fbecc8}
#ov img.ri{width:16px;image-rendering:pixelated;vertical-align:middle}
.hide{display:none!important}
body.big #top{font-size:18px}body.big #info{font-size:15px}body.big #bond{font-size:14px}body.big .slot .nm{font-size:13px}body.big .card .nm{font-size:15px}body.big .card .sub{font-size:12px}body.big #ov .box{font-size:17px}body.big #ov table{font-size:15px}body.big #tip{font-size:16px}
@media (max-width:899px),(max-aspect-ratio:1/1){
 body.battle:not(.shopopen) .tabs,body.battle:not(.shopopen) #shop,body.battle:not(.shopopen) #bond{display:none}
 body.battle #bShop{display:inline-block}
}
@media (min-width:900px) and (min-aspect-ratio:1/1){
 #app{flex-direction:row;max-width:1400px}
 #side{width:440px;border-top:none;border-left:3px double #7a4a24;overflow:auto}
 #shop{min-height:120px}
}
</style>
</head>

function sfx(t){

 try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 const now=AC.currentTime;if(sfxLast[t]&&now-sfxLast[t]<0.07)return;sfxLast[t]=now;
 const g=AC.createGain();g.connect(AC.destination);
 const tone=(type,f1,f2,dur,vol,delay)=>{const o=AC.createOscillator(),gg=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,now+(delay||0));o.frequency.exponentialRampToValueAtTime(f2,now+(delay||0)+dur);gg.gain.setValueAtTime(vol,now+(delay||0));gg.gain.exponentialRampToValueAtTime(0.001,now+(delay||0)+dur);o.connect(gg);gg.connect(AC.destination);o.start(now+(delay||0));o.stop(now+(delay||0)+dur+0.02);};
 const noise=(dur,freq,vol,type)=>{const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;const gg=AC.createGain();gg.gain.value=vol;s.connect(f);f.connect(gg);gg.connect(AC.destination);s.start(now);};
 switch(t){
  case 'slash':noise(0.09,2200,0.25);break;
  case 'arrow':tone('triangle',1400,500,0.08,0.05);break;
  case 'fire':noise(0.25,500,0.3,'lowpass');break;

const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);

function pose(mv,k){
 // k: 0..1 攻击进度；返回 角度(弧度,0=竖直向上,正=向前)、身体偏移、兵器前伸、刀光
 let ang=0.2,bx=0,by=0,wx=0,trail=null,lines=0;
 if(k<0||k>1)return{ang,bx,by,wx};
 if(mv==='chop'){const A0=0.2,A1=-1.6,A2=2.3;
  if(k<0.22){ang=lerp(A0,A1,ease(k/0.22));bx=-2*ease(k/0.22);}
  else if(k<0.32){ang=A1;bx=-2;}
  else if(k<0.42){const q=ease((k-0.32)/0.1);ang=lerp(A1,A2,q);bx=lerp(-2,5,q);by=lerp(0,2,q);trail=[A1,ang,1];}
  else if(k<0.62){ang=A2;bx=5;by=2;trail=[A1,A2,1-(k-0.42)/0.2];}
  else{const q=ease((k-0.62)/0.38);ang=lerp(A2,A0,q);bx=lerp(5,0,q);by=lerp(2,0,q);}}
 else if(mv==='sweep'){const A0=0.2,A1=-2.4,A2=2.7;
  if(k<0.24){ang=lerp(A0,A1,ease(k/0.24));bx=-3*ease(k/0.24);}
  else if(k<0.32){ang=A1;bx=-3;}
  else if(k<0.44){const q=ease((k-0.32)/0.12);ang=lerp(A1,A2,q);bx=lerp(-3,4,q);trail=[A1,ang,1];}
  else if(k<0.64){ang=A2;bx=4;trail=[A1,A2,1-(k-0.44)/0.2];}
  else{const q=ease((k-0.64)/0.36);ang=lerp(A2,A0,q);bx=lerp(4,0,q);}}
 else if(mv==='thrust'){
  if(k<0.2){ang=lerp(0.2,1.57,ease(k/0.2));}
  else if(k<0.32){ang=1.57;wx=-7*ease((k-0.2)/0.12);bx=-1;}
  else if(k<0.42){ang=1.57;wx=lerp(-7,14,ease((k-0.32)/0.1));bx=3;lines=1;}
  else if(k<0.6){ang=1.57;wx=14;bx=3;lines=1-(k-0.42)/0.18;}
  else{const q=ease((k-0.6)/0.4);ang=lerp(1.57,0.2,q);wx=lerp(14,0,q);bx=lerp(3,0,q);}}
 else if(mv==='bow'){
  if(k<0.2)ang=lerp(0.1,1.57,ease(k/0.2));else if(k<0.4){ang=1.57;wx=-2;}else if(k<0.5){ang=1.57;wx=1;}else ang=lerp(1.57,0.1,ease((k-0.5)/0.5));}
 else if(mv==='cast'){ang=0.3+Math.sin(Math.min(1,k/0.6)*Math.PI*2)*0.9;}
 return{ang,bx,by,wx,trail,lines};
}

function genLane(minX,maxX,gx){
 let x=minX+rnd(maxX-minX+1);const pts=[[x,-1]];let y=-1;
 while(true){let ny=y+2+rnd(3);if(ny>=10)ny=11;pts.push([x,ny]);y=ny;if(ny>=11)break;
  let nx,t=0;do{nx=minX+rnd(maxX-minX+1);t++;}while(Math.abs(nx-x)<2&&t<30);
  if(Math.abs(nx-x)<2)nx=(x-minX>maxX-x)?minX:maxX;pts.push([nx,y]);x=nx;}
 if(x!==gx)pts.push([gx,11]);pts.push([gx,ROWS]);return pts;
}
function buildPaths(paths){
 PATHS=[];PATHCELL=new Set();
 for(const pts of paths){
  const segs=[];let len=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],l=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);if(!l)continue;segs.push({a,b,l,s:len});len+=l;
   for(let xx=Math.min(a[0],b[0]);xx<=Math.max(a[0],b[0]);xx++)for(let yy=Math.min(a[1],b[1]);yy<=Math.max(a[1],b[1]);yy++)if(yy>=0&&yy<ROWS)PATHCELL.add(xx+','+yy);}
  const samp=[];for(let d=0;d<len;d+=0.5)samp.push(posFrom(segs,d));
  PATHS.push({segs,len,samp,threat:0});
 }
}
function genMap(themeId){

 MAP={theme:themeId,paths};buildPaths(paths);
 BUILD=new Set();HIGH=new Set();DECO=new Map();
 const near=(c,r)=>{let m=9;for(const k of PATHCELL){const[x,y]=k.split(',').map(Number);m=Math.min(m,Math.max(Math.abs(x-c),Math.abs(y-r)));}return m;};
 const dw=th.deco,tot=dw.rock+dw.tree+dw.water;const cand=[];
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=c+','+r;if(PATHCELL.has(k))continue;
  const d=near(c,r);const pb=(d===1?0.55:d===2?0.4:0.18)*th.build;
  if(r<ROWS-1&&Math.random()<pb){BUILD.add(k);if(d<=2)cand.push(k);}
  else if(r<ROWS-1){let t=Math.random()*tot;DECO.set(k,t<dw.rock?'rock':t<dw.rock+dw.tree?'tree':'water');}}
 let need=16-[...BUILD].filter(k=>{const[c,r]=k.split(',').map(Number);return near(c,r)<=2;}).length;
 if(need>0){const extra=shuffle([...DECO.keys()].filter(k=>{const[c,r]=k.split(',').map(Number);return near(c,r)<=2;}));
  for(const k of extra.slice(0,need)){DECO.delete(k);BUILD.add(k);cand.push(k);}}
 for(const k of shuffle(cand).slice(0,th.high))HIGH.add(k);

 let s=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){s-=ws[i];if(s<=0)return pool[i];}return pool[0];}

 removeUnit(other);

function calcSyn(){
 const on=new Set(G.units.map(u=>u.id));
 const fac={shu:0,wei:0,wu:0,qun:0},role={mj:0,ms:0,gs:0,qj:0};
 for(const id of on){fac[U[id].f]++;role[U[id].role]++;}
 const combos=[];
 for(const cb of COMBOS){const n=cb.m.filter(id=>on.has(id)).length;let lv=-1;cb.need.forEach((k,i)=>{if(n>=k)lv=i});combos.push({cb,lv,n});}
 const yuxi={};for(const u of G.units)for(const it of u.items)if(IT[it.id].facAtk)yuxi[U[u.id].f]=(yuxi[U[u.id].f]||0)+IT[it.id].facAtk*ITEM_STAR[it.star];
 G.syn={fac,role,combos,yuxi};
}
const facPct=n=>n>=6?45:n>=4?25:n>=2?10:0;
function stat(u){
 const g=U[u.id],A=ATK[g.atk],sy=G.syn;
 let atk=G.perk.atk||0,spd=0,rng=0,rage=0,hp=0,fire=0,stunC=0;
 atk+=facPct(sy.fac[g.f]);atk+=sy.yuxi[g.f]||0;
 const rl=sy.role;
 if(g.role==='mj'){if(rl.mj>=2)hp+=40;if(rl.mj>=4){hp+=40;atk+=20;}}
 if(g.role==='ms'){if(rl.ms>=2)rage+=30;if(rl.ms>=4)rage+=40;rage+=G.perk.msRage||0;}
 if(g.role==='gs'){if(rl.gs>=2)rng+=0.3;if(rl.gs>=4){rng+=0.3;spd+=15;}}
 if(g.role==='qj'){if(rl.qj>=2)spd+=15;if(rl.qj>=4)spd+=20;if(G.perk.tieqi)spd+=25;}
 if(g.block){hp+=G.perk.jintang||0;if(mod('wenyi'))hp-=30;}
 for(const {cb,lv} of sy.combos){if(lv<0)continue;const e=cb.eff[lv];
  if(e.fac){if(g.f===e.fac){spd+=e.spd||0;atk+=e.atk||0;}continue;}
  if(e.only&&e.only!==u.id)continue;if(!cb.m.includes(u.id))continue;
  const mul=(cb.n==='五虎上将'&&G.country==='shu')?1.5:1;
  atk+=(e.atk||0)*mul;spd+=(e.spd||0)*mul;rage+=e.rage||0;hp+=e.hp||0;fire+=e.fire||0;}
 let own=false;
 for(const it of u.items){const t=IT[it.id],m=ITEM_STAR[it.star];
  atk+=(t.atk||0)*m;spd+=(t.spd||0)*m;rng+=(t.rng||0)*(t.rng>0?m:1);rage+=(t.rage||0)*m;hp+=(t.hp||0)*m;fire+=(t.fire||0)*m;stunC+=(t.stunC||0)*m;
  if(t.archer&&g.role==='gs')spd+=t.archer*m;
  if(t.own&&t.own.split('|').includes(u.id)){own=true;atk+=20;}}
 for(const v of G.units){if(v===u||v.c<0||u.c<0)continue;if(Math.abs(v.c-u.c)<=1&&Math.abs(v.r-u.r)<=1)for(const it of v.items){const t=IT[it.id],m=ITEM_STAR[it.star];atk+=(t.auraAtk||0)*m;spd+=(t.auraSpd||0)*m;}}
 if(G.buffAtk>0)atk+=30;if(G.haste>0)spd+=40;
 const wx=G.waveOn?G.weather:G.nextWx;
 if(wx==='shu'){atk+=20;rage-=30;}
 if(wx==='xue')spd-=15;
 if(wx==='wu')rng-=0.5;
 if(G.night)rng-=0.6;
 if((wx==='yu'||wx==='wu')&&g.role==='gs')rng-=0.4;
 if((wx==='yu'||wx==='xue')&&g.role==='qj')spd-=30;
 if(G.country==='wu'&&(g.atk==='melee'||g.atk==='charge'))atk-=10;
 if(G.country==='wu')fire+=40;
 if(u.c>=0&&HIGH.has(u.c+','+u.r)){rng+=0.5;if(g.role==='gs')atk+=15;}
 let fm=1;if(g.atk==='fire'){fm=1+fire/100;if(wx==='dongfeng')fm*=1.6;if(wx==='yu')fm*=0.4;if(wx==='leiyu')fm*=0.6;}
 let base=TIER_D[g.t]*A.dm*STAR_M[u.star]*Math.max(0.2,1+atk/100)*fm;
 const msm=g.role==='ms'?0.55:1;
 const cd=(g.role==='ms'?1.6:A.cd)/Math.max(0.3,1+spd/100);
 const range=Math.max(1,A.r+0.1*g.t+0.15*(u.star-1)+rng);
 return{u,dmg:base*msm,skdmg:base*(g.role==='ms'?1.3:1),cd,range,rage:Math.max(0.3,1+rage/100),hpPct:hp,own,stunC,rad:1.0+0.1*(u.star-1),ms:g.role==='ms',gs:g.role==='gs'};
}
function blockHp(u){const s=stat(u);return 80*[0,1,1.4,2,2.8,4][U[u.id].t]*STAR_M[u.star]*Math.max(0.3,1+s.hpPct/100);}

// ================= 敌人择路 =================
function calcThreat(){
 for(const P of PATHS){let t=0;
  for(const u of G.units){if(u.down)continue;const s=stat(u);const dps=s.dmg/s.cd;const cx=u.c+.5,cy=u.r+.5;
   let n=0;for(const q of P.samp)if(Math.hypot(q[0]-cx,q[1]-cy)<=s.range)n++;
   t+=dps*n;if(U[u.id].block&&P.samp.some(q=>Math.abs(q[0]-cx)<0.3&&Math.abs(q[1]-cy)<0.3))t+=u.hp*0.3;}
  P.threat=t;}
}
function choosePath(boss){
 if(PATHS.length<2)return 0;if(G.laneBlocked>=0)return 1-G.laneBlocked;
 if(!boss&&Math.random()<0.3)return rnd(PATHS.length);
 return PATHS[0].threat<=PATHS[1].threat?0:1;
}

function curEF(w){if(G.lv)return G.lv.ef;return['huangjin','dongzhuo','yuanshao','nanman'][Math.floor((Math.max(1,w)-1)/5)%4];}
function bossFor(w){if(G.lv)return G.lv.boss[w]||null;if(w%5!==0)return null;return pickOne([['zhangjiao'],['huaxiong','lvbu','dongzhuo'],['yanliang','wenchou','yuanshao'],['menghuo']][Math.floor((w-1)/5)%4]);}
function hpScale(w){const M=G.lv?G.lv.M:1.1,Gr=G.lv?G.lv.G:1.25;return M*Math.pow(Gr,w-1)*(G.country==='wei'?1.15:1)*(mod('shiqiE')?1.15:1);}
function genWave(w,theme){
 const q=[];let n=6+2*w;const push=(ty,hpM)=>q.push({ty,gap:ty==='qi'?0.5:0.8,hpM:hpM||1});
 if(theme==='qi'){for(let i=0;i<n;i++)push(Math.random()<0.8?'qi':'bing');}
 else if(theme==='dun'){n=Math.round(n*0.8);for(let i=0;i<n;i++)push(Math.random()<0.7?'dun':'bing');}
 else if(theme==='swarm'){n=Math.round(n*1.6);for(let i=0;i<n;i++)q.push({ty:'bing',gap:0.45,hpM:0.6});}
 else if(theme==='elite'){n=Math.round(n*0.5);for(let i=0;i<n;i++)q.push({ty:pickOne(['bing','qi','dun']),gap:1.1,hpM:2.2,elite:1});}
 else for(let i=0;i<n;i++){let ty='bing';const r=Math.random();if(w>=3&&r<0.28)ty='qi';if(w>=5&&r>0.8)ty='dun';push(ty);}
 const b=bossFor(w);if(b)q.push({ty:'boss',boss:b,gap:1.5,hpM:1});
 if(G.mods.zengyuan===w)q.push({ty:'boss',boss:pickOne(Object.keys(BOSS)),gap:1.5,hpM:0.6});
 return q;
}
function enemyLook(e){
 if(e.boss){const B=BOSS[e.bossId];const L=Object.assign({},B.look);if(!L.robe){const f=FAC[B.f||'qun'];L.robe=f.c;L.robe2=f.c2;}if(L.face==='S')delete L.face;return L;}
 const ef=EFAC[e.ef];const L={robe:ef.c,robe2:ef.c2,hat:e.ef==='huangjin'?'turban':'helm',hatC:ef.c2,wpn:'spear'};
 if(e.type==='qi')L.horse=1;if(e.type==='dun'){L.shield=1;L.shieldC=ef.c;L.armor=1;}if(e.ef==='nanman')L.face='D';return L;
}
function spawn(it){
 const w=G.wave,sc=hpScale(w)*(it.hpM||1),ef=curEF(w);let e;
 if(it.ty==='boss'){const B=BOSS[it.boss];e={boss:true,bossId:it.boss,name:B.n,hp:520*B.hp*sc,spd:0.55,atk:40*Math.pow(sc,0.7),armor:4+w*0.3,gold:5,drop:B.drop};}
 else{const T=ETYPE[it.ty];e={type:it.ty,hp:T.hp*sc,spd:T.spd*(G.event==='jing'?1.25:1),atk:T.atk*Math.pow(sc,0.7),armor:(T.armor+(it.elite?2:0))*(1+w*0.1),gold:T.gold+(it.elite?1:0),elite:it.elite};}
 Object.assign(e,{ef,max:e.hp,d:0,pi:choosePath(e.boss),slow:0,stun:0,imm:0,walk:Math.random()*2,hitB:new Set(),hitT:0,atkT:-1,deadT:0});
 e.look=enemyLook(e);e.wpn=weapon(e.look.wpn);e.mv=moveOf(e.look,'mj');
 G.enemies.push(e);
}
function startWave(){
 if(G.waveOn||G.over||G.wave>=G.wmax||G.choosing)return;
 if(!G.units.length){toast('先把武将拖到地图上');return;}
 saveRun();
 G.wave++;G.weather=G.nextWx;G.theme=G.nextTheme;G.spawnQ=genWave(G.wave,G.theme);G.spawnT=0;G.waveOn=true;
 for(const u of G.units){u.maxhp=blockHp(u);u.hp=u.maxhp;u.down=false;u.downT=0;u.cool=0;u.dmgW=0;u.killW=0;u.tankW=0;}

function hurt(e,dmg,src){
 if(e.dead)return 0;if(G.vuln>0)dmg*=1.5;
 const arm=src&&src.ms?0:e.armor;const d=Math.max(1,dmg-arm);
 e.hp-=d;e.hitT=0.12;
 if(src&&src.u)src.u.dmgW+=Math.min(d,e.hp+d);
 if(src&&src.stunC&&Math.random()*100<src.stunC&&e.imm<=0&&!e.boss)e.stun=0.6;
 if(e.hp<=0){e.dead=true;e.deadT=0.6;
  if(src&&src.u)src.u.killW++;
  if(e.gold){G.gold+=e.gold;const p=ePos(e);G.fx.push({k:'txt',x:p[0],y:p[1],t:0,life:1,s:'+'+e.gold+'金',c:'#ffd56b'});}
  if(e.boss)dropEx(e,ePos(e));
  ui();}
 return d;
}

function castSkill(u,s){
 const g=U[u.id],sk=g.sk,cx=u.c+.5,cy=u.r+.5;
 let pw=s.own?2:1;
 if(G.weather==='leiyu'&&u.items.some(it=>IT[it.id].thunder))pw*=2;
 G.fx.push({k:'skill',x:cx,y:cy,t:0,life:1.4,s:sk.n+'！'});u.skT=0;u.atkT=0;sfx('skill');G.shake=Math.max(G.shake,0.18);
 const D=s.skdmg*pw;
 const num=(e,v)=>{if(!v)return;const p=ePos(e);G.fx.push({k:'num',x:p[0],y:p[1],t:0,life:0.8,s:Math.round(v)});};
 const aoeSelf=(rr,m)=>{alive().forEach(e=>{const p=ePos(e);if(Math.hypot(p[0]-cx,p[1]-cy)<=rr)num(e,hurt(e,D*m,s))});G.fx.push({k:'ring',x:cx,y:cy,r:rr,t:0,life:0.5,c:'255,200,80'});};
 switch(sk.k){
  case 'nuke':{const e=front();if(!e)break;const p=ePos(e);
   if(sk.line)alive().forEach(x=>{const q=ePos(x);if(x!==e&&Math.hypot(q[0]-p[0],q[1]-p[1])<=1.6)num(x,hurt(x,D*sk.m*0.5,s))});
   num(e,hurt(e,D*sk.m,s));G.fx.push({k:'line',x:cx,y:cy,x2:p[0],y2:p[1],t:0,life:0.4});G.fx.push({k:'boom',x:p[0],y:p[1],r:sk.line?1.6:0.8,t:0,life:0.5});break;}
  case 'aoeSelf':aoeSelf(sk.rr+0.15*(u.star-1),sk.m);if(sk.twice)G.pend.push({t:0.4,f:()=>{if(G.units.includes(u))aoeSelf(sk.rr,sk.m)}});break;
  case 'aoeFront':{const e=front();if(!e)break;const p=ePos(e);const rr=sk.rr*(pw>1?1.3:1);
   alive().forEach(x=>{const q=ePos(x);if(Math.hypot(q[0]-p[0],q[1]-p[1])<=rr){num(x,hurt(x,D*sk.m,s));if(sk.stun&&x.imm<=0){x.stun=sk.stun*(x.boss?0.5:1);x.imm=x.stun+3;}if(sk.slow)x.slow=3;if(sk.kb)knock(x,sk.kb);}});
   G.fx.push({k:'boom',x:p[0],y:p[1],r:rr,t:0,life:0.7});sfx('fire');break;}
  case 'volley':{const es=alive();for(let i=0;i<sk.cnt*pw&&es.length;i++){const e=es[i%es.length];G.shots.push({k:'arrow',x:cx,y:cy,tg:e,dmg:s.dmg,spd:8+i*0.3,src:s,pierce:1+(G.perk.chuanyun||0)});}break;}
  case 'stunAll':alive().forEach(e=>{if(e.imm<=0){e.stun=(sk.t+0.3*(u.star-1))*(e.boss?0.4:1);e.imm=e.stun+4;}num(e,hurt(e,D*sk.m,s))});G.fx.push({k:'flash',t:0,life:0.5,c:'255,240,150'});break;
  case 'stunLocal':alive().forEach(e=>{const p=ePos(e);if(Math.hypot(p[0]-cx,p[1]-cy)<=sk.rr){if(e.imm<=0){e.stun=sk.t*(e.boss?0.5:1);e.imm=e.stun+3;}hurt(e,D*sk.m,s);}});G.fx.push({k:'ring',x:cx,y:cy,r:sk.rr,t:0,life:0.5,c:'255,240,150'});break;
  case 'haste':G.haste=Math.max(G.haste,sk.t*pw*0.5+u.star);G.fx.push({k:'flash',t:0,life:0.4,c:'120,220,120'});break;
  case 'vuln':G.vuln=Math.max(G.vuln,sk.t*pw*0.5+u.star);G.fx.push({k:'flash',t:0,life:0.5,c:'160,60,200'});break;
  case 'buffAtk':G.buffAtk=Math.max(G.buffAtk,sk.t*pw*0.5+u.star);G.fx.push({k:'flash',t:0,life:0.4,c:'255,120,80'});break;
  case 'heal':G.lives=Math.min(G.maxLives+5,G.lives+(u.star>=3?2:1)*pw);for(const v of G.units){v.hp=v.maxhp;v.down=false;v.downT=0;}G.fx.push({k:'flash',t:0,life:0.5,c:'120,255,160'});ui();break;
  case 'global':alive().forEach(e=>{num(e,hurt(e,D*sk.m,s));const p=ePos(e);G.fx.push({k:'boom',x:p[0],y:p[1],r:0.6,t:0,life:0.6})});G.fx.push({k:'flash',t:0,life:0.6,c:'255,110,30'});sfx('fire');break;
 }
 if(sk.gold){const gg=u.star+1;G.gold+=gg;G.fx.push({k:'txt',x:cx,y:cy-0.6,t:0,life:1.2,s:'+'+gg+'金',c:'#ffd56b'});ui();}
}
function knock(e,m){if(e.dead)return;let kb=0.9*(m||1)*(G.perk.tieqi?2:1);if(e.boss)kb*=0.3;const wx=G.weather;if(wx==='yu'||wx==='xue')kb*=0.5;e.d=Math.max(0,e.d-kb);e.hitB=new Set();}

// ================= 更新 =================
function update(dt){
 if(!G||G.over||G.paused||G.choosing)return;
 G.haste=Math.max(0,G.haste-dt);G.vuln=Math.max(0,G.vuln-dt);G.buffAtk=Math.max(0,G.buffAtk-dt);G.shake=Math.max(0,G.shake-dt);
 for(const p of G.pend)p.t-=dt;const due=G.pend.filter(p=>p.t<=0);G.pend=G.pend.filter(p=>p.t>0);for(const p of due)p.f();
 if(G.waveOn){G.threatT-=dt;if(G.threatT<=0){G.threatT=1.5;calcThreat();}}
 if(G.waveOn&&G.spawnQ.length){G.spawnT-=dt;if(G.spawnT<=0){const it=G.spawnQ.shift();spawn(it);G.spawnT=it.gap;}}
 if(G.waveOn&&G.weather==='leiyu'){G.thunderT-=dt;if(G.thunderT<=0){G.thunderT=2+Math.random()*1.5;const es=alive();if(es.length){const e=pickOne(es);const p=ePos(e);hurt(e,e.max*0.12+20);G.fx.push({k:'bolt',x:p[0],y:p[1],t:0,life:0.4});G.fx.push({k:'flash',t:0,life:0.25,c:'230,230,255'});}}}
 const wxSpd=G.weather==='dongfeng'?1.15:G.weather==='yu'?0.8:G.weather==='wu'?0.85:G.weather==='xue'?0.7:1;
 const blockers=G.units.filter(u=>U[u.id].block&&isPath(u.c,u.r)&&!u.down);
 for(const b of blockers)b.blockN=0;
 for(const e of G.enemies){
  if(e.dead){e.deadT-=dt;continue;}
  e.imm-=dt;e.hitT=Math.max(0,e.hitT-dt);if(e.atkT>=0){e.atkT+=dt/0.5;if(e.atkT>1)e.atkT=-1;}
  if(e.stun>0){e.stun-=dt;continue;}
  const p=ePos(e);let b=null;
  for(const u of blockers){if(u.down)continue;const dx=u.c+.5-p[0],dy=u.r+.5-p[1];if(Math.hypot(dx,dy)<0.62){
   const ahead=posAt(e.pi,e.d+0.3);if(Math.hypot(u.c+.5-ahead[0],u.r+.5-ahead[1])<Math.hypot(dx,dy)+0.05){
    if(e.type==='qi'&&!e.boss){if(!e.hitB.has(u.uid)){e.hitB.add(u.uid);u.hp-=e.atk*5;u.tankW+=e.atk*5;u.hurtT=0.25;G.fx.push({k:'txt',x:u.c+.5,y:u.r+.3,t:0,life:0.8,s:'撞！',c:'#ff8a7a'});if(u.hp<=0)downU(u);}continue;}
    if(u.blockN<2){b=u;break;}}}}
  if(b){b.blockN++;const dd=e.atk*dt;b.hp-=dd;b.tankW+=dd;e.walk+=dt*0.5;e.face=b.c+.5<p[0]?-1:1;
   if(e.atkT<0&&Math.random()<dt*1.5){e.atkT=0;b.hurtT=0.2;}if(b.hp<=0)downU(b);continue;}
  const sp=e.spd*(e.slow>0?0.5:1)*wxSpd;e.slow=Math.max(0,e.slow-dt);e.d+=sp*dt;e.walk+=dt*sp*2;
  if(e.d>=PATHS[e.pi].len){e.dead=true;e.deadT=0;G.lives-=e.boss?5:1;G.fx.push({k:'flash',t:0,life:0.4,c:'220,30,30'});sfx('leak');G.shake=0.15;ui();
   if(G.lives<=0){G.lives=0;ui();loseLevel();return;}}
 }
 for(const u of G.units){
  u.hurtT=Math.max(0,u.hurtT-dt);if(u.upT>0)u.upT-=dt;if(u.skT>=0&&u.skT<1)u.skT+=dt;
  if(u.atkT>=0){u.atkT+=dt/u.atkDur;if(u.atkT>1)u.atkT=-1;}
  if(u.dash){u.dash.t+=dt;if(u.dash.t>=u.dash.life)u.dash=null;}
  if(u.down){u.downT+=dt;continue;}
  const g=U[u.id];
  if(g.block&&isPath(u.c,u.r)&&!u.blockN&&u.hp<u.maxhp)u.hp=Math.min(u.maxhp,u.hp+u.maxhp*0.04*dt);
  if(u.uid===G.spyUid)continue;
  let s=null;
  if(g.role==='ms'&&G.waveOn){s=stat(u);u.rage+=9*s.rage*dt;if(u.rage>=100&&G.enemies.some(e=>!e.dead)){u.rage=0;castSkill(u,s);}u.rage=Math.min(100,u.rage);}
  u.cool-=dt;if(u.cool>0)continue;
  s=s||stat(u);const cx=u.c+.5,cy=u.r+.5;
  let best=null,bv=-1;const inR=[];
  for(const e of G.enemies){if(e.dead)continue;const q=ePos(e);if(Math.hypot(q[0]-cx,q[1]-cy)<=s.range){inR.push(e);const v=e.d/PATHS[e.pi].len;if(v>bv){bv=v;best=e;}}}
  if(!best)continue;
  u.cool=s.cd;const bq=ePos(best);u.face=bq[0]<cx-0.05?-1:1;
  u.atkDur=Math.min(0.5,s.cd*0.85);u.atkT=0;
  const hit=HIT_AT[u.mv]*u.atkDur;
  if(g.atk==='arrow'){G.pend.push({t:hit,f:()=>{if(!best.dead){G.shots.push({k:'arrow',x:cx+u.face*0.2,y:cy-0.4,tg:best,dmg:s.dmg,spd:10,src:s,pierce:s.gs?1+(G.perk.chuanyun||0):0});sfx('arrow');}}});}
  else if(g.atk==='fire'){G.pend.push({t:hit,f:()=>{if(!best.dead){G.shots.push({k:'fire',x:cx+u.face*0.3,y:cy-0.5,tg:best,dmg:s.dmg,spd:5,rad:s.rad,src:s});sfx('fire');}}});}
  else if(g.atk==='magic'){G.pend.push({t:hit,f:()=>{if(!best.dead){hurt(best,s.dmg,s);const q=ePos(best);G.fx.push({k:'spark',x:q[0],y:q[1],t:0,life:0.35});}}});}
  else if(g.atk==='melee'){const tg=inR.sort((a,b)=>b.d-a.d).slice(0,3);G.pend.push({t:hit,f:()=>{tg.forEach(e=>hurt(e,s.dmg,s));sfx('slash');}});}
  else if(g.atk==='roar'){G.pend.push({t:hit,f:()=>{inR.forEach(e=>{hurt(e,s.dmg,s);e.slow=1.6});G.fx.push({k:'ring',x:cx,y:cy,r:s.range,t:0,life:0.45,c:'230,230,255'});sfx('hit');}});}
  else if(g.atk==='charge'){u.atkDur=0.55;u.atkT=0;u.dash={x:bq[0],y:bq[1],t:0,life:0.55};
   G.pend.push({t:0.22,f:()=>{alive().forEach(e=>{const p=ePos(e);if(Math.hypot(p[0]-bq[0],p[1]-bq[1])<=1.0){hurt(e,s.dmg,s);knock(e,1);}});G.fx.push({k:'dust',x:bq[0],y:bq[1],t:0,life:0.4});sfx('slash');}});}
  if(g.role!=='ms'){u.rage+=20*s.rage;if(u.rage>=100){u.rage=0;castSkill(u,s);}}
 }
 for(const p of G.shots){
  if(p.tg&&!p.tg.dead){const q=ePos(p.tg);p.tx=q[0];p.ty=q[1]-0.3;}
  else if(p.k==='arrow'||p.tx===undefined){p.done=true;continue;}
  const dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.hypot(dx,dy),mv=p.spd*dt;
  if(dist<=mv){p.done=true;
   if(p.k==='arrow'){const am=e=>p.src&&p.src.gs?(e.boss||e.type==='qi'?2:e.type==='dun'?0.5:1):1;
    hurt(p.tg,p.dmg*am(p.tg),p.src);
    if(p.pierce){const others=alive().filter(e=>e!==p.tg).map(e=>({e,d:Math.hypot(ePos(e)[0]-p.tx,ePos(e)[1]-p.ty)})).filter(o=>o.d<1.3).sort((a,b)=>a.d-b.d).slice(0,p.pierce);
     for(const o of others){hurt(o.e,p.dmg*0.7*am(o.e),p.src);const q=ePos(o.e);G.fx.push({k:'line',x:p.tx,y:p.ty,x2:q[0],y2:q[1]-0.3,t:0,life:0.2});}}}
   else{alive().forEach(e=>{const q=ePos(e);if(Math.hypot(q[0]-p.tx,q[1]-p.ty-0.3)<=p.rad)hurt(e,p.dmg,p.src)});G.fx.push({k:'boom',x:p.tx,y:p.ty+0.3,r:p.rad,t:0,life:0.4});}
  }else{p.x+=dx/dist*mv;p.y+=dy/dist*mv;p.a=Math.atan2(dy,dx);}
 }
 G.shots=G.shots.filter(p=>!p.done);
 G.enemies=G.enemies.filter(e=>!e.dead||e.deadT>0);
 for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<f.life);
 for(const w of WXP){w.y+=w.vy*dt;w.x+=w.vx*dt;if(w.y>ROWS)w.y-=ROWS+1;if(w.x>COLS)w.x-=COLS;if(w.x<0)w.x+=COLS;}
 if(G.waveOn&&!G.spawnQ.length&&!G.enemies.some(e=>!e.dead))endWave();
}
function downU(u){u.down=true;u.hp=0;u.downT=0;G.fx.push({k:'txt',x:u.c+.5,y:u.r+.2,t:0,life:1.2,s:U[u.id].n+'退下了',c:'#ff8a7a'});tip('down','挡路的猛将<b>血掉光就退下</b>，下一波会回来。一人最多拦两个敌人，敌方骑兵会撞他一下直接冲过去，后面得有人补刀。');}

 G.choosing=true;
 showOv(`<h2 class="kai">${kind==='good'?'🧧 锦囊妙计':'💀 祸事临头'}</h2><p>${kind==='good'?'挑一个好处':'必须挑一件，两害相权取其轻'}</p>

function applyChoice(kind,x){
 const w=G.wave,P=G.perk;

function recallUnit(u,slot){
 if(slot==null||slot<0){toast('备战席满了');return false;}
 const other=G.bench[slot];
 if(other){if(!canStand(other,u.c,u.r)){toast(`${U[other.id].n}站不了那个位置`);return false;}
  G.bench[slot]=u;G.units=G.units.filter(x=>x!==u);other.c=u.c;other.r=u.r;G.units.push(other);other.maxhp=blockHp(other);other.hp=other.maxhp;}
 else{G.units=G.units.filter(x=>x!==u);G.bench[slot]=u;}
 u.c=-1;u.r=-1;u.down=false;calcSyn();ui();panel();return true;
}
function placeUnit(u,c,r){
 const fromBench=u.c<0;
 if(!canStand(u,c,r)){toast(isPath(c,r)?`${U[u.id].n}是${ROLES[U[u.id].role]}，只有猛将能站在路上`:'这里是山石树林或水，站不了人');return false;}
 const occ=unitAt(c,r);
 if(occ&&occ!==u){
  if(fromBench){const bi=G.bench.indexOf(u);G.bench[bi]=occ;G.units=G.units.filter(x=>x!==occ);G.units.push(u);occ.c=-1;occ.r=-1;}
  else{if(!canStand(occ,u.c,u.r)){toast(`${U[occ.id].n}站不了那个位置，换不了`);return false;}occ.c=u.c;occ.r=u.r;}
 }else{
  if(fromBench&&G.units.length>=G.pop){toast(`场上最多 ${G.pop} 人，点「扩军」加人`);return false;}
  if(fromBench){G.bench[G.bench.indexOf(u)]=null;G.units.push(u);}
 }
 u.c=c;u.r=r;u.anim=0.3;u.maxhp=blockHp(u);u.hp=u.maxhp;u.down=false;u.face=c<5?1:-1;
 calcSyn();
 if(U[u.id].block&&isPath(c,r))tip('block','猛将站在<b>路上</b>能拦敌人，但一个人<b>最多拦两个</b>，多的会挤过去，敌方<b>骑兵</b>会撞他一下直接冲过去。');
 else tip('place',`放好了！${ROLES[U[u.id].role]}的长处：${ROLE_INFO[U[u.id].role].good}。<br>场上的人也能<b>按住拖动</b>挪位置、拖到另一人身上换位、拖回备战席收回。点「出战」开打。`);
 ui();panel();return true;
}

function dragStart(ev,kind,data){

}

function dropPoint(d,x,y){return{x,y:y-(d.touch?55:0)};}
document.addEventListener('pointermove',ev=>{
 const d=G&&G.drag;if(!d||ev.pointerId!==d.pid)return;
 if(!d.started){if(Math.hypot(ev.clientX-d.sx,ev.clientY-d.sy)<8)return;dragBegin(d);}
 ev.preventDefault();
 const p=dropPoint(d,ev.clientX,ev.clientY);
 ghost.style.transform=`translate(${p.x-36}px,${p.y-84}px)`;
 d.cell=cellAtPoint(p.x,p.y);d.x=p.x;d.y=p.y;

},{passive:false});
function endDrag(){ghost.classList.add('hide');sellzone.classList.add('hide');sellzone.classList.remove('hot');if(G)G.drag=null;}
document.addEventListener('pointerup',ev=>{
 const d=G&&G.drag;if(!d||ev.pointerId!==d.pid)return;
 if(!d.started){endDrag();tapOn(d);return;}
 const p={x:d.x,y:d.y};
 const sr=sellzone.getBoundingClientRect();const inSell=!sellzone.classList.contains('hide')&&p.x>=sr.left&&p.x<=sr.right&&p.y>=sr.top&&p.y<=sr.bottom;
 ghost.classList.add('hide');sellzone.classList.add('hide');
 const el=document.elementFromPoint(p.x,p.y);
 const slotEl=el&&el.closest&&el.closest('.slot[data-b]');const bagEl=el&&el.closest&&el.closest('.card[data-bi]');
 const cellP=d.cell;
 G.drag=null;sellzone.classList.remove('hot');
 if(d.kind==='unit'){
  if(inSell){sellUnit(d.u);return;}
  if(cellP){placeUnit(d.u,cellP.c,cellP.r);G.sel={k:'unit',u:d.u};panel();return;}
  if(slotEl){const bi=+slotEl.dataset.b;if(d.u.c>=0)recallUnit(d.u,bi);else{const o=G.bench[bi];const fi=G.bench.indexOf(d.u);G.bench[bi]=d.u;G.bench[fi]=o;panel();}return;}
  return;}
 if(d.kind==='card'){
  if(cellP){const id=G.shop[d.i]&&G.shop[d.i].id;if(!id)return;
   const tmp=newUnit(id,1);if(!canStand(tmp,cellP.c,cellP.r)){toast(isPath(cellP.c,cellP.r)?`${U[id].n}不是猛将，不能站在路上`:'这里站不了人');return;}
   const u=buyGen(d.i,true);if(!u)return;
   if(u.c<0){const occ=unitAt(cellP.c,cellP.r);if(occ||G.units.length<G.pop)placeUnit(u,cellP.c,cellP.r);else toast(`场上满了（${G.pop}人），先放在备战席`);}
   return;}
  if(slotEl||p.y>cv.getBoundingClientRect().bottom){buyGen(d.i);return;}
  return;}
 if(d.kind==='item'){
  if(inSell){const it=G.bag[d.bi];G.gold+=itemSell(it);G.bag.splice(d.bi,1);toast(`卖掉 ${IT[it.id].n}`);G.sel=null;ui();panel();return;}
  let target=null;if(cellP)target=unitAt(cellP.c,cellP.r);if(!target&&slotEl)target=G.bench[+slotEl.dataset.b];
  if(target){const it=G.bag[d.bi];if(equip(it,target)){G.bag.splice(d.bi,1);G.sel={k:'unit',u:target};calcSyn();sfx('up');}panel();return;}
  if(bagEl){const j=+bagEl.dataset.bi;if(j!==d.bi){combineBag(d.bi,j);G.sel=null;panel();}return;}
  return;}
 if(d.kind==='shopitem'){buyItem(d.ii);return;}
});
document.addEventListener('pointercancel',()=>{if(G&&G.drag)endDrag();});
function tapOn(d){
 if(d.kind==='unit'){G.sel=(G.sel&&G.sel.u===d.u)?null:{k:'unit',u:d.u};panel();return;}
 if(d.kind==='card'){buyGen(d.i);return;}
 if(d.kind==='item'){G.sel=(G.sel&&G.sel.k==='item'&&G.sel.i===d.bi)?null:{k:'item',i:d.bi};panel();return;}
 if(d.kind==='shopitem'){const c=G.ishop[d.ii];if(c)toast(IT[c.id].n+'：'+itemDesc(c.id));buyItem(d.ii);return;}

  <h2 class="kai" style="font-size:16px">专属宝物</h2><p style="font-size:13px">兵器铺偶尔刷出（红框发光），打败大将必掉一件。</p><table>${EX_ITEMS.map(k=>`<tr><td>${IT[k].ic} ${IT[k].n}</td><td><small>${itemDesc(k)}</small></td></tr>`).join('')}</table>`;
 if(tab==='wx')body=`<table>${Object.keys(WX).map(k=>`<tr><td>${WX[k].n}</td><td>${WX[k].d}</td></tr>`).join('')}</table>`;
 if(tab==='bond')body=`<table><tr><td><b>同国</b></td><td>场上同一国的不同武将：2位攻+10%，4位+25%，6位+45%</td></tr>
  ${['mj','ms','gs','qj'].map(r=>`<tr><td><img class="ri" src="${roleIconURL(r)}"> <b>${ROLES[r]}</b></td><td>${{mj:'2位：挡路血量+40%；4位：再+40%，近战攻+20%',ms:'2位：怒气涨快30%；4位：快70%',gs:'2位：射程+0.3；4位：射程+0.6，出手快15%',qj:'2位：出手快15%；4位：快35%'}[r]}</td></tr>`).join('')}
  ${COMBOS.map(c=>`<tr><td><b>${c.n}</b></td><td>${c.m.map(id=>U[id].n).join('、')}<br><small>${c.d}</small></td></tr>`).join('')}</table>`;
 if(tab==='jin')body=`<p style="font-size:13px">开局可以打开这些规矩：</p><table>${Object.keys(OPTS).map(k=>`<tr><td>${OPTS[k].n}</td><td><small>${OPTS[k].d}</small></td></tr>`).join('')}</table>
  <h2 class="kai" style="font-size:16px">🧧 锦囊</h2><table>${GOOD.map(x=>`<tr><td>${x.n}</td><td><small>${x.d}</small></td></tr>`).join('')}</table>
  <h2 class="kai" style="font-size:16px">💀 祸事</h2><p style="font-size:12px">祸事只添难，不会直接扣城防，打得好照样能完胜。</p><table>${BAD.map(x=>`<tr><td>${x.n}</td><td><small>${x.d}</small></td></tr>`).join('')}</table>`;
 showOv(`<h2 class="kai">📖 说明书</h2><div class="btabs">${Object.keys(BOOK_TABS).map(k=>`<span class="${k===tab?'on':''}" data-bt="${k}">${BOOK_TABS[k]}</span>`).join('')}</div>${body}<button id="bk">返回</button>`);
 document.querySelectorAll('[data-bt]').forEach(el=>el.onclick=()=>book(el.dataset.bt,back));
 $('bk').onclick=back;
}

// ================= 主循环 =================
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(G)for(let i=0;i<G.speed;i++)update(dt);
 draw();requestAnimationFrame(loop);}
window.addEventListener('resize',resize);
try{new ResizeObserver(resize).observe($('wrap'));}catch(e){}
resize();title();requestAnimationFrame(loop);
</script>
</body>
</html>
